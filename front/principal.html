<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Intelecta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root {
            --sidebar-bg: #ffffff; --main-bg: #f0f4f8; --card-bg: #ffffff; --text-primary: #1e293b; --text-secondary: #64748b; --accent-blue: #3b82f6; --border-color: #e2e8f0; --active-bg: #f1f5f9; --hover-bg: #f8fafc;
            --green-light: #f0fdf4; --green: #22c55e;
            --yellow-light: #fefce8; --yellow: #eab308;
            --blue-light: #eff6ff; --blue: #3b82f6;
            --purple-light: #f5f3ff; --purple: #8b5cf6;
            --red-light: #fef2f2; --red: #ef4444;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--main-bg); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: var(--sidebar-bg); padding: 20px; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); box-sizing: border-box; position: fixed; z-index: 100; }
        .sidebar .logo { display: flex; align-items: center; margin-bottom: 30px; padding-left: 10px; }
        .sidebar .logo-img { width: 40px; height: auto; }
        .sidebar .logo h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0 10px; color: var(--text-primary); }
        .sidebar nav { flex-grow: 1; }
        .sidebar nav ul { list-style: none; padding: 0; margin: 0; }
        .sidebar nav a { display: flex; align-items: center; padding: 12px 10px; border-radius: 8px; text-decoration: none; color: var(--text-secondary); font-weight: 500; margin-bottom: 5px; transition: background-color 0.2s ease, color 0.2s ease; }
        .sidebar nav a i { width: 20px; margin-right: 15px; text-align: center; }
        .sidebar nav a:hover { background-color: var(--hover-bg); color: var(--text-primary); }
        .sidebar nav a.active { background-color: var(--active-bg); color: var(--accent-blue); font-weight: 600; }
        .sidebar .logout { margin-top: auto; }
        main { margin-left: 250px; width: calc(100% - 250px); height: 100vh; overflow-y: auto; padding: 40px; box-sizing: border-box; }
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 2rem; font-weight: 700; margin: 0; }
        .header p { font-size: 1.1rem; color: var(--text-secondary); margin-top: 5px; }
        .hidden { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .stat-card { background-color: var(--card-bg); border-radius: 12px; padding: 25px; display: flex; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .icon { font-size: 1.5rem; padding: 15px; border-radius: 50%; margin-right: 20px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .stat-card .info .number { font-size: 2rem; font-weight: 700; }
        .stat-card .info .label { font-size: 0.9rem; color: var(--text-secondary); }
        .icon.units { background-color: var(--blue-light); color: var(--blue); }
        .icon.activities { background-color: var(--yellow-light); color: var(--yellow); }
        .icon.students { background-color: var(--green-light); color: var(--green); }
        .icon.teachers { background-color: var(--purple-light); color: var(--purple); }
        .icon.classes { background-color: var(--red-light); color: var(--red); }
        .content-section { margin-top: 40px; }
        .content-section h2 { font-size: 1.5rem; margin-bottom: 20px; }
        .list-container { background-color: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); overflow: hidden; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
        .list-item:last-child { border-bottom: none; }
        .list-item .title { font-weight: 500; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo"><img src="/front/img/logo.svg" alt="Logo Intelecta" class="logo-img"><h1>Intelecta</h1></div>
        <nav>
            <ul>
                <li><a href="/front/principal.html" class="active"><i class="fas fa-home"></i> Principal</a></li>
                <li><a href="/front/unidades.html"><i class="fas fa-book-open"></i> Unidades Curriculares</a></li>
                <li><a href="/front/atividades.html"><i class="fas fa-tasks"></i> Atividades</a></li>
                <li><a href="/front/statistics.html"><i class="fas fa-chart-bar"></i> Estatísticas</a></li>
                <li id="admin-panel-link" class="hidden"><a href="/front/admin.html"><i class="fas fa-user-shield"></i> Painel de Admin</a></li>
            </ul>
        </nav>
        <div class="logout"><a href="#" id="logout-button"><i class="fas fa-sign-out-alt"></i> Sair</a></div>
    </aside>

    <main>
        <header class="header">
            <h1 id="welcome-title">Carregando...</h1>
            <p id="welcome-subtitle">Aqui está um resumo da sua plataforma.</p>
        </header>

        <div id="dashboard-container">
            <!-- Conteúdo do dashboard será inserido aqui -->
        </div>
    </main>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = '/front/index.html';

        const welcomeTitle = document.getElementById('welcome-title');
        const dashboardContainer = document.getElementById('dashboard-container');
        const adminPanelLink = document.getElementById('admin-panel-link');

        async function fetchAPI(url) {
            const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (response.status === 401) { localStorage.removeItem('access_token'); window.location.href = '/front/index.html'; }
            if (!response.ok) throw new Error('Falha ao buscar dados da API');
            return response.json();
        }

        function createStatCard(iconClass, colorClass, label, value) {
            return `
                <div class="stat-card">
                    <div class="icon ${colorClass}"><i class="fas ${iconClass}"></i></div>
                    <div class="info">
                        <div class="number">${value}</div>
                        <div class="label">${label}</div>
                    </div>
                </div>
            `;
        }

        async function loadDashboard() {
            try {
                const [stats, recentActivities, units] = await Promise.all([
                    fetchAPI('/dashboard/stats'),
                    fetchAPI('/dashboard/recent-activities'),
                    fetchAPI('/units/')
                ]);

                const unitsMap = new Map(units.map(u => [u.id, u.name]));

                const statsHtml = `
                    <div class="stats-grid">
                        ${createStatCard('fa-book-open', 'units', 'Unidades', stats.units)}
                        ${createStatCard('fa-tasks', 'activities', 'Atividades', stats.activities)}
                        ${createStatCard('fa-user-graduate', 'students', 'Alunos', stats.students)}
                        ${createStatCard('fa-chalkboard-teacher', 'teachers', 'Professores', stats.teachers)}
                        ${createStatCard('fa-school', 'classes', 'Turmas', stats.classes)}
                    </div>
                `;

                const activitiesHtml = recentActivities.length > 0 ? recentActivities.map(act => `
                    <div class="list-item">
                        <span class="title">${act.title} <span style="color: var(--text-secondary); font-size: 0.9em;">(${unitsMap.get(act.unit_id) || 'N/A'})</span></span>
                        <a href="/front/atividades.html#view-${act.id}" style="font-size: 0.9em;">Ver</a>
                    </div>
                `).join('') : '<p style="padding: 20px; color: var(--text-secondary);">Nenhuma atividade recente.</p>';

                dashboardContainer.innerHTML = `
                    ${statsHtml}
                    <div class="content-section">
                        <h2>Atividades Recentes</h2>
                        <div class="list-container">${activitiesHtml}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Erro ao carregar dashboard:', error);
                dashboardContainer.innerHTML = '<p>Não foi possível carregar os dados do dashboard.</p>';
            }
        }

        async function initialize() {
            try {
                const user = await fetchAPI('/users/me');
                welcomeTitle.textContent = `Bem-vindo(a), ${user.name}!`;
                if (user.role === 'admin') {
                    adminPanelLink.classList.remove('hidden');
                }
                loadDashboard();
            } catch (error) {
                console.error('Erro na inicialização:', error);
                welcomeTitle.textContent = 'Bem-vindo(a)!';
                dashboardContainer.innerHTML = '<p>Ocorreu um erro ao carregar as informações.</p>';
            }
        }
        
        document.getElementById('logout-button').addEventListener('click', e => {
            e.preventDefault();
            localStorage.removeItem('access_token');
            window.location.href = '/front/index.html';
        });

        initialize();
    </script>
</body>
</html>
