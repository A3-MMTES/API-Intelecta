<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Intelecta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .container {
            display: flex;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .left-panel {
            flex: 1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #fff;
        }
        .right-panel {
            flex: 1;
            background: linear-gradient(to bottom right, #3B82F6, #1E40AF);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;                
            color: white;
            text-align: center;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }
        
        .right-panel .brain-logo {
            width: 450px;
            height: 450px;
            margin-bottom: 20px;
        }

        
        .right-panel h1 {
            font-size: 5rem;
            font-weight: bold;
            
        }
        .left-panel h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            
        }
        .left-panel p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .form-options .remember-me {
            display: flex;
            align-items: center;
        }
        .form-options .remember-me input {
            margin-right: 5px;
        }
        .form-options a {
            color: #007bff;
            text-decoration: none;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .separator {
            text-align: center;
            margin-bottom: 20px;
            color: #6c757d;
        }
        .signup-link {
            text-align: center;
            font-size: 0.9rem;
        }
        .signup-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
    /* Layout padrão (desktop) */
.container {
    display: flex;
    width: 100%;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

/* ======== MOBILE (TELAS ATÉ 768px) ======== */
@media (max-width: 768px) {

body {
    height: auto;
    display: block;
}

.container {
    flex-direction: column-reverse; /* Formulário embaixo, imagem em cima */
    width: 100%;
    box-shadow: none;
}

.left-panel {
    padding: 30px 20px;
    flex: none;
}

.right-panel {
    flex: none;
    padding: 40px 20px;
    border-radius: 0; 
    border-top-right-radius: 20px;
    border-top-left-radius: 20px;
}

.right-panel .brain-logo {
    width: 130px;
    height: 130px;
}

.right-panel h1 {
display: none;}

.left-panel h1 {
    font-size: 1.5rem;
}

.btn-login {
    padding: 12px;
    font-size: 0.95rem;
}
}


    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>Bem vindo!</h1>
            <p>Insira seus dados para acessar a Intelecta</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="email@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Lembrar-me</label>
                    </div>
                    <a href="#">Esqueci minha senha</a>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <div class="separator">Ou</div>
            <div class="signup-link">
                Não tem uma conta? <a href="/front/signup.html">Crie aqui</a>
            </div>
        </div>
        <div class="right-panel">
            <img id="logosvg" src="img/logo.svg"  alt="Intelecta Logo" class="brain-logo">
            <h1>Intelecta</h1>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/auth/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/front/principal.html';
            } else {
                alert('Falha no login. Verifique suas credenciais.');
            }
        });
    </script>
</body>
</html>
