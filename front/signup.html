<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta - Intelecta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .container {
            display: flex;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .left-panel {
            flex: 1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #fff;
        }
        .right-panel {
            flex: 1;
            background: linear-gradient(to bottom right, #3B82F6, #1E40AF);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }
        .right-panel .brain-logo {
            width: 450px;
            height: 450px;
            margin-bottom: 60px;
            top: 10px;
        }
        .right-panel h1 {
            font-size: 5rem; /* Tamanho da fonte. */
            margin-bottom: 10px; /* Espaçamento inferior. */
        }
        .left-panel h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .left-panel p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .form-options .remember-me {
            display: flex;
            align-items: center;
        }
        .form-options .remember-me input {
            margin-right: 5px;
        }
        .form-options a {
            color: #007bff;
            text-decoration: none;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .separator {
            text-align: center;
            margin-bottom: 20px;
            color: #6c757d;
        }
        .signup-link {
            text-align: center;
            font-size: 0.9rem;
        }
        .signup-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }



        @media (max-width: 768px) {
    body {
        display: block;
        height: auto;
    }

    .container {
        flex-direction:column-reverse;
        height: auto;
        box-shadow: none;
    }

    .right-panel { /* move o painel azul pro topo */
        border-radius: 0;
        padding: 40px 20px;
    }

    .right-panel .brain-logo {
        width: 180px;
        height: 180px;
    }

    .right-panel h1 {
        font-size: 1.8rem;
    }

    .left-panel {
        padding: 30px 20px;
        border-radius: 0;
    }

    .left-panel h1 {
        font-size: 1.5rem;
    }

    .form-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .btn-login {
        padding: 12px;
        font-size: 1rem;
    }

    .signup-link {
        font-size: 0.85rem;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>Crie sua conta</h1>
            <p>Adicione seus dados para criar a sua conta</p>
            <form id="signup-form">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Insira seu nome aqui" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="exemplo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">Aceito os termos e condições</label>
                    </div>
                </div>
                <button type="submit" class="btn-login">Criar</button>
            </form>
            <div class="separator">Ou</div>
            <div class="signup-link">
                Já tem uma conta? <a href="/front/index.html">Entre aqui</a>
            </div>
        </div>
        <div class="right-panel">
            <img src="img/logo.svg" alt="Intelecta Logo" class="brain-logo">
            <h1>Intelecta</h1>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/users/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    name: name, 
                    email: email, 
                    password: password, 
                    role: 'student', // ou outro role padrão
                    school_id: 1 // id de escola padrão
                })
            });

            if (response.ok) {
                alert('Conta criada com sucesso! Você será redirecionado para a página de login.');
                window.location.href = '/index.html';
            } else {
                alert('Falha ao criar conta. Tente novamente.');
            }
        });
    </script>
</body>
</html>
